name: Atualizar dados EONET

on:
  schedule:
    # Todos os dias às 09:00 UTC (06:00 em Brasília)
    - cron: "0 9 * * *"
  workflow_dispatch: # permite executar manualmente pela aba Actions

# Boas práticas obrigatórias
permissions:
  contents: read

concurrency:
  group: update-data-eonet
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar pipeline de coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_nasa.py
